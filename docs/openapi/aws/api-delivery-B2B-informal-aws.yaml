          pattern: ^.*$
          maxLength: 256
        idempotenceToken:
          type: string
          description: >-
            token usato per disambiguare "richieste di notificazione" effettuate
            con lo stesso  numero di protocollo.
          pattern: ^[ -~]*$
          maxLength: 256
