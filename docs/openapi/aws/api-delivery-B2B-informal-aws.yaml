    get:
      operationId: retrieveInformalNotificationRequestStatusV1
      tags:
        - SenderReadInformalNotificationB2B
      summary: Verifica accettazione richiesta notifica
      description: >-
        Questa operazione serve per verificare se la richiesta di notifica è
        stata accettata e ottenere lo IUN associato a tale richiesta. <br/>
        Bisogna specificare il parametro _notificationRequestId_  oppure la
        coppia costituita dai parametri  _paProtocolNumber_ e
        _idempotenceToken_. <br/>
      parameters:
