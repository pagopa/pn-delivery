    InformalSentNotificationV1:
      description: >-
        Informazioni complete di una notifica informale accettata, incluse le
        caratteristiche della richiesta originaria e i metadati di invio.
      allOf:
        - $ref: '#/components/schemas/InformalNotificationRequestV1'
