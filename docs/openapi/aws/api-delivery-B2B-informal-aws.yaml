  /v1/notifications/informal:
    post:
      summary: Richiesta sottomissione di una nuova comunicazione bonaria
      description: >-
        Operazione utilizzata dalla Pubblica Amministrazione per richiedere
        l'invio di una notifica bonaria.


        La restituzione di uno stato HTTP 202 significa solo che la richiesta è
        sintatticamente

        valida, non che la richiesta sia stata validata ed accettata. <br/>

        Per conoscere lo stato di accettazione della richiesta di notifica
        bisogna utilizzare l'operazione

        getInformalNotificationRequestStatusV1 oppure utilizzare la modalità
        push prevista dai webhook. <br/>
      tags:
        - NewInformalNotification
      operationId: sendNewInformalNotificationV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformalNotificationRequestV1'
        required: true
      responses:
        '202':
          description: Accepted
