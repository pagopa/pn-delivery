      operationId: informalPresignedUploadRequest
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/InformalPreLoadRequest'
              minItems: 1
              maxItems: 15
        required: true
      responses:
        '200':
          description: Informazioni per il caricamento degli allegati tramite URL presigned
