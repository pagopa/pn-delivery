components:
  parameters:
    notificationRequestId:
      in: query
      required: false
      name: notificationRequestId
      example: TVBNRS1RR1RHLVZNVEUtMjAyNjA2LUgtQQ==
      schema:
        $ref: '#/components/schemas/NotificationRequestId'
    paProtocolNumber:
      name: paProtocolNumber
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PaProtocolNumber'
    idempotenceToken:
      name: idempotenceToken
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/IdempotenceToken'
    pathDocumentIdx:
      name: docIdx
      description: indice del documento nella lista partendo da 0.
      in: path
      required: true
      schema:
        type: number
    pathRecipientIdx:
      name: recipientIdx
      description: indice del destinatario nella lista partendo da 0.
      in: path
      required: true
      schema:
        type: number
    pathAttachmentName:
      name: attachmentName
      description: Tipologia del pagamento allegato alla notifica. Valore possibile PAGOPA
      in: path
      required: true
      schema:
        type: string
        pattern: PAGOPA
    attachmentIdx:
      in: query
      name: attachmentIdx
      description: indice del documento di pagamento partendo da 0
      required: false
      schema:
        type: number
    pathInformalIun:
      description: Identificativo Univoco Notifica informale
      name: iun
      in: path
      required: true
      schema:
        type: string
        minLength: 25
        maxLength: 25
        pattern: ^[A-Z]{4}-[A-Z]{4}-[A-Z]{4}-[0-9]{6}-[A-Z]{1}-[A-Z]{1}$
  schemas:
    InformalPreLoadRequest:
      title: Richiesta di precaricamento di un File
      type: object
      required:
        - sha256
      properties:
        preloadIdx:
          title: Id della richiesta di precaricamento di un file
          description: >-
            Identificativo univoco all'interno della request HTTP, serve per
            correlare la risposta. Stringa alfanumerica con caratteri
            utilizzabili in un nome file.
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[a-zA-Z0-9._-]{1,512}$
        contentType:
          title: MIME type del file che verrà caricato
          description: >-
            Il MIME type dell'allegato che dovrà essere caricato. Attualmente
            sono supportati
              - application/pdf
          type: string
          minLength: 15
          maxLength: 16
          pattern: ^application\/(pdf)$
        sha256:
          title: checksum sha256 del file che verrà caricato
          description: >-
            checksum sha256, codificato in base 64, del contenuto binario del
            file che verrà caricato
          type: string
          example: jezIVxlG1M1woCSUngM6KipUN3/p8cG5RMIPnuEanlE=
          minLength: 44
          maxLength: 44
          pattern: ^[A-Za-z0-9+\/]{43}=|[A-Za-z0-9+\/]{44}$
    InformalPreLoadResponse:
      title: Informazioni per il caricamento file
      description: >-
        Per ogni richiesta che è stata fatta viene fornito un presigned URL e
        le  informazioni per usarlo.
      type: object
      properties:
        preloadIdx:
          description: >-
            per correlazione con la richiesta. Stringa alfanumerica con
            caratteri utilizzabili in un file.
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[a-zA-Z0-9._-]{1,512}$
        secret:
          description: >-
            Token aggiuntivo per far si che sia necessario intercettare anche
            gli  header e non solo l'URL di upload del contenuto del documento.
          example: AZ23RF12
          type: string
        httpMethod:
          description: >-
            Indica se per l'upload del contenuto file bisogna utilizzare il
            metodo PUT o POST
          type: string
          example: PUT
          enum:
            - POST
            - PUT
        url:
          description: URL a cui effettuare l'upload del contenuto del documento.
          type: string
          example: https://preloadpn.aws.amazon.......
        key:
          description: >-
            la chiave restituita sarà globalmente unica e andrà utilizzata nella
            richiesta  di notifica.
          example: PN_NOTIFICATION_ATTACHMENTS-0001-301W-B9CB-9U72-WIKD
          type: string
    LocalizedContent:
      type: object
      required:
        - subject
        - longBody
        - language
      properties:
        subject:
          type: string
          maxLength: 256
          description: Titolo del messaggio (es. Oggetto della mail o intestazione IO)
          example: Sollecito di pagamento Tari 2023
        longBody:
          type: string
          maxLength: 10000
          description: Corpo esteso del messaggio in formato Markdown
          example: Gentile cittadino, la informiamo che...
        shortBody:
          type: string
          maxLength: 160
          description: Versione breve per SMS o anteprime
          example: 'Sollecito Tari: hai una nuova comunicazione da SEND.'
        language:
          type: string
          description: >-
            Lingua del messaggio. Valori accettati: - IT <br/> - DE <br/> - SL
            <br/> - FR <br/> DE (tedesco), SL (sloveno), FR (francese).
    NewMessageRequest:
      type: object
      required:
        - primaryMessage
      properties:
        primaryMessage:
          allOf:
            - $ref: '#/components/schemas/LocalizedContent'
            - description: >-
                Contenuto principale del messaggio, deve essere in lingua
                italiana
        additionalMessage:
          allOf:
            - $ref: '#/components/schemas/LocalizedContent'
            - description: >-
                Contenuto aggiuntivo del messaggio, opzionale, può essere in una
                lingua diversa dall'italiano
    MessageResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/NewMessageRequest'
        - type: object
          properties:
            messageId:
              description: >-
                Identificativo univoco del messaggio, da utilizzare per creare
                una notifica bonaria
              type: string
              format: uuid
            createdAt:
              description: Data e ora di creazione del messaggio
              type: string
              format: date-time
    NewInformalNotificationResponse:
      $ref: '#/components/schemas/NewNotificationResponse'
    NewInformalNotificationRequestStatusResponseV1:
      allOf:
        - $ref: '#/components/schemas/InformalNotificationRequestV1'
        - type: object
          required:
            - notificationRequestId
            - notificationRequestStatus
          properties:
            notificationRequestId:
              $ref: '#/components/schemas/NotificationRequestId'
            notificationRequestStatus:
              description: >-
                - __WAITING__: in attesa di essere valutata - __ACCEPTED__:
                richiesta di notifica accettata, lo IUN è valorizzato -
                __REFUSED__: richiesta di notifica rifiutata, è valorizzato il
                campo _errors_
              type: string
            retryAfter:
              type: number
              description: >-
                Numero di secondi da attendere prima di effettuare una nuova
                richiesta per  la stessa entità; valorizzato quando lo status è
                __WAITING__.
            iun:
              $ref: '#/components/schemas/InformalIUN'
            errors:
              description: >-
                Elenco degli errori che hanno causato il rifiuto della richiesta
                di notifica
              type: array
              items:
                $ref: '#/components/schemas/NotificationRequestRefusedProblemError'
    NotificationRequestRefusedProblemError:
      allOf:
        - $ref: '#/components/schemas/ProblemError'
        - type: object
          required:
            - code
          properties:
            recIndex:
              description: Index destinatario notifica digitale
              type: number
    TerminationRequestStatus:
      description: >-
        Risposta alla richiesta di interruzione del workflow di una notifica non
        legale.
      type: object
      required:
        - status
      properties:
        status:
          description: |
            Termination request status:
              - OK
          type: string
        details:
          type: array
          maxItems: 9999
          items:
            $ref: '#/components/schemas/StatusDetail'
    StatusDetail:
      description: Informazione di dettaglio sullo stato di una richiesta
      type: object
      required:
        - code
      properties:
        code:
          description: Codice interno di errore o avvertimento, in formato leggibile
          example: >-
            NOTIFICATION_TERMINATION_ACCEPTED, NOTIFICATION_ALREADY_TERMINATED,
            etc.
          type: string
        level:
          description: |
            livello informativo del dettaglio di stato: INFO,WARN, ERR
            ERR (error) di default
          example: INFO
          type: string
        detail:
          description: Spiegazione specifica per questa occorrenza del problema.
          example: Parametro non valido
          type: string
    FullSentInformalNotificationV1:
      description: >-
        Le informazioni riguardanti una notifica (richiesta di notifica
        accettata) e il  processo di inoltro della notifica verso il cittadino.
      allOf:
        - $ref: '#/components/schemas/InformalSentNotificationV1'
        - type: object
          required:
            - notificationStatus
            - notificationStatusHistory
            - timeline
          properties:
            notificationStatus:
              $ref: '#/components/schemas/InformalNotificationStatusV1'
            notificationStatusHistory:
              $ref: '#/components/schemas/InformalNotificationStatusHistoryV1'
            timeline:
              description: >-
                elenco dettagliato di tutto ciò che è accaduto durrante il
                processo di notifica
              type: array
              items:
                $ref: '#/components/schemas/InformalTimelineElementV1'
    Problem:
      properties:
        type:
          description: URI reference of type definition
          type: string
        status:
          description: >-
            The HTTP status code generated by the origin server for this
            occurrence of the problem.
          type: number
          example: 503
          maximum: 600
          minimum: 100
          exclusiveMaximum: true
        title:
          description: >-
            A short, summary of the problem type. Written in english and
            readable
          example: Service Unavailable
          maxLength: 64
          pattern: ^[ -~]{0,64}$
          type: string
        detail:
          description: A human readable explanation of the problem.
          example: Request took too long to complete.
          maxLength: 4096
          pattern: ^.{0,4096}$
          type: string
        traceId:
          description: Internal support identifier associated to error
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        timestamp:
          description: date and time referred to UTC
          example: '2022-07-27T12:22:33.444Z'
          type: string
          format: date-time
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProblemError'
      required:
        - status
        - errors
    ProblemError:
      properties:
        code:
          description: Internal code of the error, in human-readable format
          example: >-
            PN_PARAMETER_TOO_LONG | PN_PARAMETER_TOO_SHORT | PN_DUPLICATE_ENTRY
            | etc...
          type: string
        element:
          description: Parameter or request body field name for validation error
          example: body.order.item[2].quantity
          type: string
        detail:
          description: >-
            A human readable explanation specific to this occurrence of the
            problem.
          example: Parameter not valid
          maxLength: 1024
          type: string
      required:
        - code
    InformalTimelineElementV1:
      type: object
      additionalProperties: false
      properties:
        elementId:
          type: string
          maxLength: 512
          description: >-
            Identificativo dell'elemento di timeline: insieme allo IUN della
            notifica bonaria definisce in maniera univoca l'elemento di timeline
        timestamp:
          type: string
          deprecated: true
          description: >-
            Istante in cui avviene l'evento descritto in questo elemento di
            timeline (deprecato, fare riferimento al campo eventTimestamp)
          format: date-time
        ingestionTimestamp:
          type: string
          description: >-
            Istante in cui l'evento descritto in questo elemento di timeline è
            gestito da SEND
          format: date-time
        eventTimestamp:
          type: string
          description: >-
            Istante in cui avviene l'evento descritto in questo elemento di
            timeline
          format: date-time
        notificationSentAt:
          type: string
          description: Momento di ricezione della richiesta di notifica da parte di SEND
          format: date-time
        category:
          $ref: '#/components/schemas/InformalTimelineElementCategoryV1'
        details:
          $ref: '#/components/schemas/InformalTimelineElementDetailsV1'
    InformalNotificationStatusV1:
      type: string
      description: |
        stato di avanzamento del processo di notifica bonaria:
          * `IN_VALIDATION` - Fase di validazione formale, sintattica (sincrona) ed asincrona (verifica allegati e coerenza della campagna)
          * `PROCESSING` - Stato assunto non appena la validazione ha esito positivo e l'orchestratore avvia il workflow sequenziale di consegna sui canali
          * `COMPLETED_REACHED` - Stato finale di terminazione positiva; Il destinatario è stato raggiunto alla destinazione più vicina al cittadino, ma non è stato ancora ottenuto il feedback di arresto finale desiderato dall'ente;
          * `COMPLETED_UNREACHED` - Stato finale di terminazione negativa; Il destinatario non è stato raggiunto alla destinazione più vicina al cittadino;
          * `UNDELIVERABLE` - Stato di irreperibilità totale; raggiungibile solo se la validazione asincrona consente l'ingresso di notifiche prive di qualsiasi recapito utile o di profilo IO associato
          * `REFUSED` - Notifica rifiutata a seguito della validazione
          * `ACCEPTED` - Notifica accettato a seguito della validazione
      enum:
        - IN_VALIDATION
        - PROCESSING
        - COMPLETED_REACHED
        - COMPLETED_UNREACHED
        - UNDELIVERABLE
        - REFUSED
        - ACCEPTED
    InformalNotificationStatusHistoryV1:
      description: elenco degli avanzamenti effettuati dal processo di notifica bonaria
      type: array
      items:
        $ref: '#/components/schemas/InformalNotificationStatusHistoryElementV1'
    NotificationRequestId:
      type: string
      description: identificativo univoco di una richiesta di invio notifica, non è lo IUN
      maxLength: 36
      pattern: ^[A-Za-z0-9+/=]{36}$
    PaProtocolNumber:
      description: Numero di protocollo che la PA mittente assegna alla notifica stessa
      type: string
      pattern: ^.*$
      maxLength: 256
    IdempotenceToken:
      description: >-
        Identificativo utilizzabile dal chiamante per disambiguare differenti 
        "richieste di notificazione" effettuate con lo stesso numero di
        protocollo  (campo _paProtocolNumber_). Questo può essere necessario in
        caso di  "richiesta di notifica" rifiutata per errori nei codici di
        verifica degli allegati.
      type: string
      pattern: ^[ -~]*$
      maxLength: 256
    Denomination:
      description: >-
        Denominazione ente o persona fisica / ragione sociale. La codifica
        prevede i caratteri ISO LATIN 1, senza | e senza i caratteri di
        controllo, ovvero la seguente regexp: ^[ -{}~\u00A0-ÿ]*$
      type: string
      minLength: 1
      maxLength: 88
      pattern: ^.*$
    TaxId:
      description: C.F. persona fisica o persona giuridica
      type: string
      minLength: 11
      maxLength: 16
      pattern: >-
        ^([A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{3}[A-Z]{1})|([0-9]{11})$
    NotificationDigitalAddress:
      description: Indirizzo di invio della notifica
      required:
        - address
        - type
      type: object
      properties:
        type:
          type: string
          description: tipo di indirizzo PEC, REM, SERCQ, ...
          enum:
            - PEC
        address:
          type: string
          example: account@domain.it
          description: >-
            Indirizzo PEC o REM che il mittente della notifica intende
            utilizzare per  raggiungere il destinatario.
          pattern: >-
            ^(?:[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*|"(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?|\[(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?|[a-zA-Z0-9-]*[a-zA-Z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
          maxLength: 320
    NotificationPhysicalAddress:
      description: Indirizzo fisico
      type: object
      required:
        - address
        - municipality
      properties:
        at:
          type: string
          description: Campo "presso" dell'indirizzo
          pattern: ^.*$
          maxLength: 44
        address:
          type: string
          description: Indirizzo del domicilio fisico
          pattern: ^.*$
          minLength: 2
          maxLength: 1024
        addressDetails:
          type: string
          description: Seconda riga dell'indirizzo fisico
          pattern: ^.*$
          maxLength: 1024
        zip:
          type: string
          description: >-
            Codice di avviamento postale. In caso di invio estero diventa
            facoltativo
          minLength: 0
          maxLength: 15
          pattern: ^(\w|\ |\-)*$
        municipality:
          type: string
          description: Comune
          pattern: ^.*$
          minLength: 2
          maxLength: 256
        municipalityDetails:
          type: string
          description: Frazione o località
          pattern: ^.*$
          maxLength: 256
        province:
          type: string
          description: Provincia
          pattern: ^.*$
          maxLength: 256
        foreignState:
          type: string
          description: Denominazione paese estero
          pattern: ^.*$
          maxLength: 256
    noticeCode:
      description: Payment notice number  numero avviso
      example: '302000100000019421'
      type: string
      maxLength: 18
      minLength: 18
      pattern: ^\d+$
    paTaxId:
      description: Payment PA fiscal code
      example: '77777777777'
      type: string
      maxLength: 11
      minLength: 11
      pattern: ^\d+$
    NotificationAttachmentDigests:
      description: Codici per la verifica del corretto caricamento di un allegato
      type: object
      required:
        - sha256
      properties:
        sha256:
          type: string
          description: Digest "sha256" della codifica binaria dell'allegato in base64
          example: jezIVxlG1M1woCSUngM6KipUN3/p8cG5RMIPnuEanlE=
          minLength: 44
          maxLength: 44
          pattern: ^[A-Za-z0-9+\/]{43}=|[A-Za-z0-9+\/]{44}$
    NotificationAttachmentBodyRef:
      description: Riferimento all'allegato precaricato
      required:
        - key
        - versionToken
      type: object
      properties:
        key:
          type: string
          description: Chiave in cui è stato salvato l'allegato
          maxLength: 512
          pattern: ^(safestorage:\/\/)?[A-Za-z0-9._-]+$
        versionToken:
          type: string
          description: >-
            Token per recuperare l'esatta istanza dell'allegato, che dovrà
            coincidere con l'__x-amz-version-id__ ottenuto nell'header della
            response in fase di upload del documento ad esso associato.
          pattern: ^.*$
          maxLength: 256
    NotificationAttachment:
      description: Un allegato della notifica.
      type: object
      required:
        - digests
        - contentType
        - ref
      properties:
        digests:
          $ref: '#/components/schemas/NotificationAttachmentDigests'
        contentType:
          type: string
          description: tipo di contenuto dell'allegato, supportato application/pdf
          minLength: 15
          maxLength: 15
          pattern: ^application\/pdf$
        ref:
          $ref: '#/components/schemas/NotificationAttachmentBodyRef'
    NotificationPaymentAttachment:
      description: Un modulo di pagamento allegato alla notifica
      allOf:
        - $ref: '#/components/schemas/NotificationAttachment'
    PagoPaPayment:
      title: Informazioni per effettuare il pagamento con sistema pagoPA
      description: >-
        Informazioni utili per effettuare il pagamento di una notifica, sono
        associate al destinatario perché le spese di notifica possono differire
        a seconda del canale di notifica utilizzato. <br/>
          - _noticeCode_: "codice avviso pagoPA" di pagamento del sistema pagoPA, usato per pagamento online.<br/>
          - _creditorTaxId_: codice fiscale dell'ente a cui fa riferimento il "codice avviso pagoPA". <br/>
          - _applyCost_: flag per indicare se l'avviso pagoPA deve contenere i costi di notifica. <br/>
          - _pagoPaForm_: riferimento al PDF contenete il bollettino pagoPA<br/>
      type: object
      required:
        - noticeCode
        - creditorTaxId
        - applyCost
      properties:
        noticeCode:
          $ref: '#/components/schemas/noticeCode'
        creditorTaxId:
          $ref: '#/components/schemas/paTaxId'
        applyCost:
          type: boolean
          nullable: false
          description: >-
            Flag per indicare se l'avviso pagoPa deve contenere i costi di
            notifica
        attachment:
          $ref: '#/components/schemas/NotificationPaymentAttachment'
    NotificationMetadataAttachment:
      description: Un metadato allegato della notifica.
      type: object
      required:
        - digests
        - contentType
        - ref
      properties:
        digests:
          $ref: '#/components/schemas/NotificationAttachmentDigests'
        contentType:
          type: string
          description: tipo di contenuto dell'allegato, supportato application/json
          minLength: 16
          maxLength: 16
          pattern: ^application\/json$
        ref:
          $ref: '#/components/schemas/NotificationAttachmentBodyRef'
    F24Payment:
      title: Informazioni per effettuare il pagamento tramite modello F24
      description: >-
        Informazioni utili per effettuare il pagamento di una notifica, sono
        associate al destinatario perché le spese di notifica possono differire
        a seconda del canale di notifica utilizzato. <br/>
          - _title_: titolo del documento pdf da mostrare all'utente .<br/>
          - _applyCost_: flag per indicare se il modello F24 deve contenere i costi di notifica.<br/>
          - _metadataAttachment_: riferimento ai metadati per la generazione del modello F24.<br/>
      type: object
      required:
        - title
        - applyCost
        - metadataAttachment
      properties:
        title:
          description: Titolo del documento pdf da mostrare all'utente
          type: string
        applyCost:
          type: boolean
          nullable: false
          description: Flag per indicare se il modello F24 deve contere i costi di notifica
        metadataAttachment:
          $ref: '#/components/schemas/NotificationMetadataAttachment'
    NotificationPaymentItem:
      minProperties: 1
      additionalProperties: false
      nullable: false
      properties:
        pagoPa:
          $ref: '#/components/schemas/PagoPaPayment'
        f24:
          $ref: '#/components/schemas/F24Payment'
    NotificationPayments:
      title: Pagamenti collegati alla notifica per il destinatario
      description: >-
        Lista dei pagamenti collegati alla notifica per il destinatario. Possono
        essere pagamenti rateali o alternativi
      type: array
      items:
        $ref: '#/components/schemas/NotificationPaymentItem'
    NotificationRecipientV24:
      description: Informazioni sui destinatari
      required:
        - denomination
        - recipientType
        - taxId
      type: object
      additionalProperties: false
      properties:
        recipientType:
          type: string
          description: >-
            Tipologia di destinatario: Persona Fisica (PF) o Persona Giuridica
            (PG)
          enum:
            - PF
            - PG
        taxId:
          $ref: '#/components/schemas/TaxId'
        denomination:
          $ref: '#/components/schemas/Denomination'
        digitalDomicile:
          $ref: '#/components/schemas/NotificationDigitalAddress'
        physicalAddress:
          $ref: '#/components/schemas/NotificationPhysicalAddress'
        payments:
          $ref: '#/components/schemas/NotificationPayments'
    PagoPaPaymentBase:
      title: Informazioni per effettuare il pagamento con sistema pagoPA
      description: >-
        Informazioni utili per effettuare il pagamento di una notifica, sono
        associate al destinatario perché le spese di notifica possono differire
        a seconda del canale di notifica utilizzato. <br/>
          - _noticeCode_: "codice avviso pagoPA" di pagamento del sistema pagoPA, usato per pagamento online.<br/>
          - _creditorTaxId_: codice fiscale dell'ente a cui fa riferimento il "codice avviso pagoPA". <br/>
          - _attachment_: riferimento al PDF contenete il bollettino pagoPA<br/>
      type: object
      required:
        - noticeCode
        - creditorTaxId
        - amount
      properties:
        noticeCode:
          $ref: '#/components/schemas/noticeCode'
        creditorTaxId:
          $ref: '#/components/schemas/paTaxId'
        attachment:
          $ref: '#/components/schemas/NotificationPaymentAttachment'
        amount:
          type: number
          description: Importo del pagamento in eurocent
          minimum: 0
        dueDate:
          type: string
          format: date-time
          description: >-
            Data di scadenza del pagamento. Il formato data deve essere ISO-8601
            e fuso orario UTC
    InformalNotificationPaymentItem:
      description: >-
        Elemento di pagamento della notifica informale. Al momento è supportato
        esclusivamente il pagamento pagoPA.
      type: object
      additionalProperties: false
      required:
        - pagoPa
      properties:
        pagoPa:
          $ref: '#/components/schemas/PagoPaPaymentBase'
    InformalNotificationPayments:
      description: >-
        Lista dei pagamenti collegati alla notifica informale per il
        destinatario.
      type: array
      items:
        $ref: '#/components/schemas/InformalNotificationPaymentItem'
    InformalNotificationRecipientV1:
      description: >-
        Dati del destinatario specifici per una notifica informale, inclusi il
        riferimento al messaggio e i canali opzionali di contatto.
      allOf:
        - $ref: '#/components/schemas/NotificationRecipientV24'
        - type: object
          required:
            - messageId
          properties:
            payments:
              $ref: '#/components/schemas/InformalNotificationPayments'
            messageId:
              type: string
              format: uuid
              description: >-
                Identificativo del template di messaggio da utilizzare per il
                destinatario.
            email:
              type: string
              example: account@domain.it
              description: >-
                Indirizzo email che il mittente della notifica intende
                utilizzare per  raggiungere il destinatario.
              pattern: >-
                ^(?:[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*|"(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?|\[(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?|[a-zA-Z0-9-]*[a-zA-Z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
              maxLength: 320
            phoneNumber:
              type: string
              example: 3900000000
              description: >-
                Numero di telefono che il mittente della notifica intende
                utilizzare per raggiungere il destinatario, espresso in formato
                internazionale con prefisso `+` oppure `00`.
              pattern: ^(\+|00)[1-9]\d{0,3}[\s.-]?\d{1,4}[\s.-]?\d{1,4}[\s.-]?\d{1,9}$
              maxLength: 30
            additionalLanguages:
              description: >-
                In questo campo è possibile definire la lingua addizionale
                (oltre a quella italiana) da utilizzare per l'invio del
                messaggio sui canali configurati.<br/> Le lingue accettate e
                dunque i valori possibili degli item dell'array sono: <br/> - DE
                <br/> - SL <br/> - FR <br/> DE (tedesco), SL (sloveno), FR
                (francese) Attualmente è possibile indicare un solo item e
                dunque una sola lingua aggiuntiva. Se non vengono indicate
                lingue aggiuntive la lingua utilizzata <br/> per l'invio del
                messaggio sui canali configurati sarà quella italiana. <br />
                **Coerenza con messageId:** Se viene fornito un `messageId`, il
                messaggio identificato deve essere associato alla lingua
                indicata in questo campo. <br/>
              type: array
              maxItems: 1
              items:
                type: string
    NotificationDocument:
      description: Un documento da notificare
      allOf:
        - $ref: '#/components/schemas/NotificationAttachment'
        - type: object
          properties:
            title:
              type: string
              description: >-
                Titolo del documento allegato. Stringa alfanumerica con
                caratteri utilizzabili in un nome file.
              minLength: 1
              maxLength: 512
              pattern: ^.*$
            docIdx:
              type: string
              description: Indice del documento partendo da 0.
              maxLength: 3
              pattern: ^\d+$
    InformalNotificationRequestV1:
      description: Dati necessari per richiedere la creazione di una notifica informale.
      type: object
      required:
        - senderDenomination
        - paProtocolNumber
        - subject
        - campaignId
        - recipients
      properties:
        senderDenomination:
          $ref: '#/components/schemas/Denomination'
        paProtocolNumber:
          $ref: '#/components/schemas/PaProtocolNumber'
        idempotenceToken:
          $ref: '#/components/schemas/IdempotenceToken'
        campaignId:
          type: string
          description: Identificativo della campagna che determina il workflow di invio.
        subject:
          type: string
          description: Oggetto della comunicazione mostrato nei riepiloghi.
        recipients:
          type: array
          description: Elenco dei destinatari della notifica informale.
          items:
            $ref: '#/components/schemas/InformalNotificationRecipientV1'
          minItems: 1
        documents:
