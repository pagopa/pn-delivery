          items:
            $ref: '#/components/schemas/TimelineElementId'
    InformalTimelineElementCategoryV1:
      type: string
      description: |
        categorie di timeline del dominio delle notifiche bonarie:
          * `VALIDATE_NORMALIZE_ADDRESSES_REQUEST` - Invio della richiesta di validazione e normalizzazione indirizzi fisici presenti nella richiesta di notifica
          * `NORMALIZED_ADDRESS` - Salvataggio indirizzi normalizzati
          * `NATIONAL_REGISTRY_VALIDATION_CALL` - Richiesta ai registri nazionali per la validazione degli indirizzi
          * `NATIONAL_REGISTRY_VALIDATION_RESPONSE` - Risposta dei registri nazionali sulla validazione degli indirizzi
          * `REQUEST_ACCEPTED` - Richiesta di notifica accettata a seguito dei controlli di validazione
          * `REQUEST_REFUSED` - Richiesta di notifica rifiutata per fallimento di validazione
      enum:
        - VALIDATE_NORMALIZE_ADDRESSES_REQUEST
        - NORMALIZED_ADDRESS
        - NATIONAL_REGISTRY_VALIDATION_CALL
        - NATIONAL_REGISTRY_VALIDATION_RESPONSE
        - REQUEST_ACCEPTED
        - REQUEST_REFUSED
