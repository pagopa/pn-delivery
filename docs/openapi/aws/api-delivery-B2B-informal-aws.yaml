  /v1/notifications/informal:
    post:
      summary: Richiesta sottomissione di una nuova comunicazione bonaria
      description: >-
        Operazione utilizzata dalla Pubblica Amministrazione per richiedere
        l'invio di una notifica bonaria.


        La restituzione di uno stato HTTP 202 significa solo che la richiesta è
        sintatticamente

        valida, non che la richiesta sia stata validata ed accettata. <br/>

        Per conoscere lo stato di accettazione della richiesta di notifica
        bisogna utilizzare l'operazione

        getInformalNotificationRequestStatusV1 oppure utilizzare la modalità
        push prevista dai webhook. <br/>
      tags:
        - NewInformalNotification
      operationId: sendNewInformalNotificationV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformalNotificationRequestV1'
            example:
              senderDenomination: Comune di Palermo
              paProtocolNumber: '302110111988283231'
              campaignId: campaign-1
              subject: Test notifica..302070111988283233
              recipients:
                - recipientType: PF
                  taxId: FRMTTR76M06B715E
                  denomination: Ettore Fieramosca
                  physicalAddress:
                    at: presso
                    address: via Roma
                    addressDetails: Strega
                    zip: '82100'
                    municipality: Benevento
                    province: BN
                    foreignState: ITALIA
                  payments:
                    - pagoPa:
                        noticeCode: '302000111988284400'
                        creditorTaxId: '77777777777'
                        amount: 1250
                        attachment:
                          digests:
                            sha256: 1QKD/Ks6BohyQ+bgMxHf9NrpNhVmGUPxRYE1aerU4JQ=
                          contentType: application/pdf
                          ref:
                            key: >-
                              PN_NOTIFICATION_ATTACHMENTS-61997b71a19c4e4e97d4228ee74326e9.pdf
                            versionToken: v1
                  messageId: 94484841-57e5-496f-8f2d-eec053c539e3
              documents:
                - digests:
                    sha256: SmHRur4+IVEaMHrYoof4mwzhxh3r2D/+WeVnMQnokgw=
                  contentType: application/pdf
                  ref:
                    key: >-
                      PN_NOTIFICATION_ATTACHMENTS-dfe837b7e83e43ec9e9135d989196fd8.pdf
                    versionToken: v1
              group: 65e0a77228425a43256303eb
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewNotificationResponse'
              example:
                notificationRequestId: TVBNRS1RR1RHLVZNVEUtMjAyNjA2LUgtQQ==
                paProtocolNumber: '302110111988283231'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
