components:
  parameters:
    ############################################################################################
    ###                     PARAMETRO VERSIONE CREAZIONE NOTIFICA                            ###
    ############################################################################################
    headerNotificationVersion:                                                      # NO EXTERNAL
      name: x-pagopa-pn-notification-version                                        # NO EXTERNAL
      in: header                                                                    # NO EXTERNAL
      description: Notification creation version                                    # NO EXTERNAL
      required: false                                                               # NO EXTERNAL
      schema:                                                                       # NO EXTERNAL
        type: string                                                                # NO EXTERNAL

    ############################################################################################
    ###                     PARAMETRO SORGENTE CREAZIONE NOTIFICA                            ###
    ############################################################################################
    headerSourceChannel:                                                            # NO EXTERNAL
      $ref: './remote-refs.yaml#/components/parameters/headerSourceChannel'         # NO EXTERNAL

    headerSourceChannelDetails:                                                     # NO EXTERNAL
      $ref: './remote-refs.yaml#/components/parameters/headerSourceChannelDetails'  # NO EXTERNAL

    ############################################################################################
    ###                     PARAMETRI DI AUTENTICAZIONE E AUTORIZZAZIONE                     ###
    ############################################################################################
    cxTypeAuthFleet:                                                                # NO EXTERNAL
      $ref: './remote-refs.yaml#/components/parameters/cxTypeAuthFleet'             # NO EXTERNAL
    cxIdAuthFleet:                                                                  # NO EXTERNAL
      $ref: './remote-refs.yaml#/components/parameters/cxIdAuthFleet'               # NO EXTERNAL
    cxGroupsAuthFleet:                                                              # NO EXTERNAL
      $ref: './remote-refs.yaml#/components/parameters/cxGroupsAuthFleet'           # NO EXTERNAL
    uidAuthFleet:                                                                   # NO EXTERNAL
      $ref: './remote-refs.yaml#/components/parameters/uidAuthFleet'                # NO EXTERNAL

    ############################################################################################
    ###                       PARAMETRI RICERCA RICHIESTA DI NOTIFICA                        ###
    ############################################################################################
    notificationRequestId:
      in: query
      required: false
      name: notificationRequestId
      example: TVBNRS1RR1RHLVZNVEUtMjAyNjA2LUgtQQ==
      schema:
        $ref: './schemas-pn-notification.yaml#/components/schemas/NotificationRequestId'

    paProtocolNumber:
      name: paProtocolNumber
      in: query
      required: false
      schema:
        $ref: './schemas-pn-notification.yaml#/components/schemas/PaProtocolNumber'

    idempotenceToken:
      name: idempotenceToken
      in: query
      required: false
      schema:
        $ref: './schemas-pn-notification.yaml#/components/schemas/IdempotenceToken'

    ############################################################################################
    ###                             PARAMETRI DOWNLOAD DOCUMENTI                             ###
    ############################################################################################
    pathDocumentIdx:
      name: docIdx
      description: indice del documento nella lista partendo da 0.
      in: path
      required: true
      schema:
        type: integer
        format: int32

    pathRecipientIdx:
      name: recipientIdx
      description: indice del destinatario nella lista partendo da 0.
      in: path
      required: true
      schema:
        type: integer
        format: int32

    pathAttachmentName:
      name: attachmentName
      description: Tipologia del pagamento allegato alla notifica. Valore possibile PAGOPA
      in: path
      required: true
      schema:
        type: string
        pattern: "PAGOPA"

    attachmentIdx:
      in: query
      name: attachmentIdx
      description: indice del documento di pagamento partendo da 0
      required: false
      schema:
        type: integer
        format: int32

  schemas:
    ###########################################################################################
    ###                             DTO PRECARICAMENTO ALLEGATI                             ###
    ###########################################################################################
    InformalPreLoadRequest:
      title: Richiesta di precaricamento di un File
      type: object
      required:
        - sha256
      properties:
        preloadIdx:
          title: Id della richiesta di precaricamento di un file
          description: >-
            Identificativo univoco all'interno della request HTTP, serve per correlare la risposta.
            Stringa alfanumerica con caratteri utilizzabili in un nome file.
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[a-zA-Z0-9._-]{1,512}$
        contentType:
          title: MIME type del file che verrà caricato
          description: >-
            Il MIME type dell'allegato che dovrà essere caricato. Attualmente sono supportati
              - application/pdf
          type: string
          minLength: 15
          maxLength: 16
          pattern: ^application\/(pdf)$
        sha256:
          title: checksum sha256 del file che verrà caricato
          description: >-
            checksum sha256, codificato in base 64, del contenuto binario del file che verrà
            caricato
          type: string
          example: 'jezIVxlG1M1woCSUngM6KipUN3/p8cG5RMIPnuEanlE='
          minLength: 44
          maxLength: 44
          pattern: ^[A-Za-z0-9+\/]{43}=|[A-Za-z0-9+\/]{44}$

    InformalPreLoadResponse:
      title: Informazioni per il caricamento file
      description: >-
        Per ogni richiesta che è stata fatta viene fornito un presigned URL e le 
        informazioni per usarlo.
      type: object
      properties:
        preloadIdx:
          description: per correlazione con la richiesta. Stringa alfanumerica con caratteri utilizzabili in un file.
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[a-zA-Z0-9._-]{1,512}$
        secret:
          description: >-
            Token aggiuntivo per far si che sia necessario intercettare anche gli 
            header e non solo l'URL di upload del contenuto del documento.
          example: AZ23RF12
          type: string
        httpMethod:
          description: >-
            Indica se per l'upload del contenuto file bisogna utilizzare il metodo PUT o POST
          type: string
          example: PUT
          enum:
            - POST
            - PUT
        url:
          description: >-
            URL a cui effettuare l'upload del contenuto del documento.
          type: string
          example: 'https://preloadpn.aws.amazon.......'
        key:
          description: >-
            la chiave restituita sarà globalmente unica e andrà utilizzata nella richiesta 
            di notifica.
          example: 'PN_NOTIFICATION_ATTACHMENTS-0001-301W-B9CB-9U72-WIKD'
          type: string

    ###########################################################################################
    ###                              DTO MESSAGGI                                           ###
    ###########################################################################################

    NewMessageRequest:
      type: object
      required: [ primaryMessage ]
      properties:
        primaryMessage:
          allOf:
            - $ref: './schemas-pn-notification.yaml#/components/schemas/LocalizedContent'
            - description: Contenuto principale del messaggio, deve essere in lingua italiana
        additionalMessage:
          allOf:
            - $ref: './schemas-pn-notification.yaml#/components/schemas/LocalizedContent'
            - description: Contenuto aggiuntivo del messaggio, opzionale, può essere in una lingua diversa dall'italiano
    MessageResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/NewMessageRequest'
        - type: object
          properties:
            messageId:
              description: Identificativo univoco del messaggio, da utilizzare per creare una notifica bonaria
              type: string
              format: uuid
            createdAt:
              description: Data e ora di creazione del messaggio
              type: string
              format: date-time

    ###########################################################################################
    ###                              DTO RICHIESTE DI NOTIFICA                              ###
    ###########################################################################################
    NewInformalNotificationResponse:
      $ref: "./schemas-pn-notification.yaml#/components/schemas/NewNotificationResponse"


    NewInformalNotificationRequestStatusResponseV1:
      allOf:
        - $ref: "./schemas-pn-notification.yaml#/components/schemas/InformalNotificationRequestV1"
        - type: object
          required:
            - notificationRequestId
            - notificationRequestStatus
          properties:
            notificationRequestId:
              $ref: "./schemas-pn-notification.yaml#/components/schemas/NotificationRequestId"
            notificationRequestStatus:
              description: >-
                - __WAITING__: in attesa di essere valutata
                - __ACCEPTED__: richiesta di notifica accettata, lo IUN è valorizzato
                - __REFUSED__: richiesta di notifica rifiutata, è valorizzato il campo _errors_
              type: string
            retryAfter:
              type: integer
              format: int32
              description: >-
                Numero di secondi da attendere prima di effettuare una nuova richiesta per 
                la stessa entità; valorizzato quando lo status è __WAITING__.
            iun:
              $ref: "./schemas-pn-notification.yaml#/components/schemas/InformalIUN"
            errors:
              description: >-
                Elenco degli errori che hanno causato il rifiuto della richiesta di notifica
              type: array
              items:
                $ref: '#/components/schemas/NotificationRequestRefusedProblemError'

    NotificationRequestRefusedProblemError:
      allOf:
        - $ref: '#/components/schemas/ProblemError'
        - type: object
          required:
            - code
          properties:
            recIndex:
              description: Index destinatario notifica digitale
              type: integer
              format: int32

    ###########################################################################################
    ###                       DTO RICHIESTE DI TERMINAZIONE WORKFLOW                        ###
    ###########################################################################################

    TerminationRequestStatus:
      description: Risposta alla richiesta di interruzione del workflow di una notifica non legale.
      type: object
      required: [ status ]
      properties:
        status:
          description: >
            Termination request status:
              - OK
          type: string
        details:
          type: array
          maxItems: 9999
          items:
            $ref: '#/components/schemas/StatusDetail'

    StatusDetail:
      description: >-
        Informazione di dettaglio sullo stato di una richiesta
      type: object
      required:
        - code
      properties:
        code:
          description: Codice interno di errore o avvertimento, in formato leggibile
          example: NOTIFICATION_TERMINATION_ACCEPTED, NOTIFICATION_ALREADY_TERMINATED, etc.
          type: string
        level:
          description: |
            livello informativo del dettaglio di stato: INFO,WARN, ERR
            ERR (error) di default
          example: INFO
          type: string
        detail:
          description: >-
            Spiegazione specifica per questa occorrenza del problema.
          example: Parametro non valido
          type: string

    ###########################################################################################
    ###                              DTO STATUS                                            ###
    ###########################################################################################

    PnStatusResponse:
      title: Stato attuale di PN
      description: >-
        Elenco delle funzionalità della piattaforma ed elenco dei disservizi
        noti e attivi  al momento della richiesta. I disservizi
        (_openIncidents_) segnalati sono al più uno  per funzionalità; gli
        attributi _endDate_ e _legalFactId_ non saranno valorizzati.
      type: object
      required:
        - functionalities
        - openIncidents
      properties:
        status:
          description: Bad Request
          example: 400
          exclusiveMaximum: true
          format: int32
          maximum: 600
          minimum: 100
          type: integer
        title:
          description: The server cannot process the request
          example: Bad Request
          maxLength: 64
          pattern: ^[ -~]{0,64}$
          type: string
        detail:
          description: The server cannot process the request
          example: Bad Request
          maxLength: 4096
          pattern: ^.{0,4096}$
          type: string
        functionalities:
          title: elenco funzionalità di PN
          description: >-
            Un array che comprende tutti i possibili valori dell'enum
            _PnFunctionality_
          type: array
          items:
            $ref: '#/components/schemas/PnFunctionality'
        openIncidents:
          title: elenco disservizi correnti
          description: Al più uno per funzionalità
          type: array
          items:
            $ref: '#/components/schemas/PnDowntimeEntry'
    PnFunctionality:
      title: Funzionalità di PN
      description: >-
        - __NOTIFICATION_CREATE__: la possibilità di creare nuove notifiche.

        - __NOTIFICATION_VISUALIZATION__: la possibilità di visualizzare le
        notifiche e scaricare gli atti. 

        - __NOTIFICATION_WORKFLOW__: l'avanzamento del processo di notifica.
      type: string
      enum:
        - NOTIFICATION_CREATE
        - NOTIFICATION_VISUALIZATION
        - NOTIFICATION_WORKFLOW
      x-enum-varnames:
        - NOTIFICATION_CREATE
        - NOTIFICATION_VISUALIZATION
        - NOTIFICATION_WORKFLOW
    PnFunctionalityStatus:
      type: string
      enum:
        - KO
        - OK
    PnDowntimeEntry:
      title: Dati relativi ad un disservizio di PN.
      type: object
      required:
        - functionality
        - status
        - startDate
      properties:
        functionality:
          $ref: '#/components/schemas/PnFunctionality'
        status:
          $ref: '#/components/schemas/PnFunctionalityStatus'
        startDate:
          title: data inizio disservizio
          type: string
          format: date-time
        endDate:
          title: data fine disservizio
          description: >-
            se il disservizio è ancora attivo questo campo sarà assente o con
            valore _null_
          type: string
          format: date-time
        legalFactId:
          title: id dell'atto opponibile a terzi
          description: >-
            Se assente o valorizzato _null_ indica che l'atto opponibile a terzi
            non è ancora disponibile. Questo avviene per i disservizi ancora
            aperti e per i disservizi  terminati da pochi minuti. <br/> Questo
            valore è da utilizzare con l'API _getLegalFact_ di questo stesso
            servizio.
          type: string
        fileAvailable:
          type: boolean

    ###########################################################################################
    ###                              DTO NOTIFICA CON DETTAGLI                              ###
    ###########################################################################################
    FullSentInformalNotificationV1:
      description: >-
        Le informazioni riguardanti una notifica (richiesta di notifica accettata) e il 
        processo di inoltro della notifica verso il cittadino.
      allOf:
        - $ref: './schemas-pn-notification.yaml#/components/schemas/InformalSentNotificationV1'
        - type: object
          required:
            - notificationStatus
            - notificationStatusHistory
            - timeline
          properties:
            notificationStatus:
              $ref: '#/components/schemas/InformalNotificationStatusV1'
            notificationStatusHistory:
              $ref: '#/components/schemas/InformalNotificationStatusHistoryV1'
            timeline:
              description: >-
                elenco dettagliato di tutto ciò che è accaduto durrante il processo di notifica
              type: array
              items:
                $ref: '#/components/schemas/InformalTimelineElementV1'
            recipientIds: # NO EXTERNAL
              description: Lista degli identificativi anonimizzati dei destinatari      # NO EXTERNAL
              type: array                                                               # NO EXTERNAL
              items: # NO EXTERNAL
                type: string                                                            # NO EXTERNAL
            sourceChannel: # NO EXTERNAL
              type: string                                                              # NO EXTERNAL
              description: Canale sorgente della richiesta di notifica                  # NO EXTERNAL
            sourceChannelDetails: # NO EXTERNAL
              type: string                                                              # NO EXTERNAL
              description: Dettagli del canale sorgente della richiesta di notifica     # NO EXTERNAL

    Problem:
      $ref: './remote-refs.yaml#/components/schemas/Problem'
    ProblemError:
      $ref: './remote-refs.yaml#/components/schemas/ProblemError'
    InformalTimelineElementV1:
      $ref: './remote-refs.yaml#/components/schemas/InformalTimelineElementV1'
    InformalNotificationStatusV1:
      $ref: './remote-refs.yaml#/components/schemas/InformalNotificationStatusV1'
    InformalNotificationStatusHistoryV1:
      $ref: './remote-refs.yaml#/components/schemas/InformalNotificationStatusHistoryV1'

