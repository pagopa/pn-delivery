# <span id="numberOfPresignedRequest">15</span> pn.delivery.number-of-presigned-request=15 numero di maxItems della preloadRequest
openapi: 3.0.3
info:
  termsOfService: https://selfcare.notifichedigitali.it/termini-di-servizio
  x-api-id: api-internal-b2b-informal-pa # NO EXTERNAL
#  x-api-id: api-internal-b2b-informal-pa # ONLY EXTERNAL
  title: 'Piattaforma Notifiche: API B2B per le notifiche bonarie esposte alle Pubbliche Amministrazioni'
  x-summary: 'Piattaforma Notifiche: API B2B per le notifiche bonarie esposte alle Pubbliche Amministrazioni'
  version: '1.0.0'
  description: #TODO: da aggiornare
    ## Abstract
    API utilizzate dalle pubbliche amministrazioni per __inviare richieste di notifiche bonarie__ e
    __ottenere informazioni in modalità pull__ sullo stato della
    _"richiesta di notifica"_ (accettata o rifiutata) e, in caso di richiesta accettata,
    sulle comunicazioni effettuate, o solo tentate, nei confronti dei destinatari della notifica.
  contact:
    name: 'SEND: supporto enti'
    url: https://pagopa.atlassian.net/servicedesk/customer/portal/5
servers:
  - url: https://api.notifichedigitali.it
    description: Ambiente di produzione
  - url: https://api.uat.notifichedigitali.it
    description: Ambiente di collaudo
tags:
  - name: Messages
    description: >-
      Invocazioni utilizzabili dai mittenti per creare messaggi da utilizzare
      nelle notifiche bonarie.
  - name: NewInformalNotification
    description: >-
      Invocazioni per effettuare il pre-caricamento dei documenti della notifica
      e inviare notifiche bonarie.
  - name: SenderReadInformalNotificationB2B
    description: >-
      Invocazioni utilizzabili dai mittenti per verificare lo stato delle
      richieste di notifica inviate e delle notifiche accettate.
  - name: InformalNotificationTermination
    description: >-
      Invocazioni per interrompere il workflow di una notifica non legale in
      stato di attesa o accettata.
  - name: HealthCheck
    description: >-
      Invocazioni per sapere lo stato del microservizio
paths:
  /status:
    get:
      summary: status path
      description: status path per verificare lo stato di Piattaforma Notifiche
      tags:
        - HealthCheck
      operationId: status
      responses:
        '200':
          description: Ok
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PnStatusResponse'
              example:
                functionalities:
                  - NOTIFICATION_CREATE
                  - NOTIFICATION_VISUALIZATION
                  - NOTIFICATION_WORKFLOW
                openIncidents: [ ]
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PnStatusResponse'
              example:
                functionalities:
                  - NOTIFICATION_CREATE
                  - NOTIFICATION_VISUALIZATION
                  - NOTIFICATION_WORKFLOW
                openIncidents:
                  - functionality: NOTIFICATION_CREATE
                    status: KO
                    startDate: '2019-08-24T14:15:22Z'
  ###########################################################################################
  ###                          GESTIONE PRECARICAMENTO ALLEGATI                           ###
  ###########################################################################################
  "/delivery/v1/attachments/preload":
    post:
      summary: Richiesta di pre-caricamento dei documenti della notifica bonaria
      description: >-
        Operazione che richiede a Piattaforma Notifica le informazioni e le autorizzazioni necessarie 
        a precaricare uno o più file da allegare a una notifica bonaria. <br/>
      tags:
        - NewInformalNotification
      operationId: informalPresignedUploadRequest
      parameters: # NO EXTERNAL
        - $ref: '#/components/parameters/uidAuthFleet'          # NO EXTERNAL
        - $ref: '#/components/parameters/cxTypeAuthFleet'       # NO EXTERNAL
        - $ref: '#/components/parameters/cxIdAuthFleet'         # NO EXTERNAL
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/InformalPreLoadRequest"
              minItems: 1
              maxItems: 15
        required: true
      responses:
        '200':
          description: Informazioni per il caricamento degli allegati tramite URL presigned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InformalPreLoadResponse"
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  ###########################################################################################
  ###                          GESTIONE MESSAGGI                                          ###
  ###########################################################################################

  "/delivery/v1/messages":
    post:
      tags:
        - Messages
      summary: Crea un nuovo template di messaggio
      description: |
        Salva il contenuto del messaggio in modo sicuro e ottiene un messageId da utilizzare per creare una notifica bonaria.
      operationId: newMessage
      parameters:                                             # NO EXTERNAL
        - $ref: '#/components/parameters/uidAuthFleet'        # NO EXTERNAL
        - $ref: '#/components/parameters/cxTypeAuthFleet'     # NO EXTERNAL
        - $ref: '#/components/parameters/cxIdAuthFleet'       # NO EXTERNAL
        - $ref: '#/components/parameters/cxGroupsAuthFleet'   # NO EXTERNAL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessageRequest'
            example:
              primaryMessage:
                subject: Oggetto IT
                longBody: Test body IT
                shortBody: Short IT
                language: IT
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                primaryMessage:
                  subject: Oggetto IT
                  longBody: Test body IT
                  shortBody: Short IT
                  language: IT
                messageId: 94484841-57e5-496f-8f2d-eec053c539e3
                createdAt: "2026-06-26T13:35:00.000Z"
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  "/delivery/v1/messages/{messageId}":
    get:
      tags:
        - Messages
