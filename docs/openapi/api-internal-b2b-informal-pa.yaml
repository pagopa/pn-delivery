  "/delivery/v1/messages":
    post:
      tags:
        - Messages
      summary: Crea un nuovo template di messaggio
      description: |
        Salva il contenuto del messaggio in modo sicuro e ottiene un messageId da utilizzare per creare una notifica bonaria.
      operationId: newMessage
      parameters:                                             # NO EXTERNAL
        - $ref: '#/components/parameters/uidAuthFleet'        # NO EXTERNAL
        - $ref: '#/components/parameters/cxTypeAuthFleet'     # NO EXTERNAL
        - $ref: '#/components/parameters/cxIdAuthFleet'       # NO EXTERNAL
        - $ref: '#/components/parameters/cxGroupsAuthFleet'   # NO EXTERNAL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessageRequest'
            example:
              primaryMessage:
                subject: Oggetto IT
                longBody: Test body IT
                shortBody: Short IT
                language: IT
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                primaryMessage:
                  subject: Oggetto IT
                  longBody: Test body IT
                  shortBody: Short IT
                  language: IT
                messageId: 94484841-57e5-496f-8f2d-eec053c539e3
                createdAt: "2026-06-26T13:35:00.000Z"
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  "/delivery/v1/messages/{messageId}":
    get:
      tags:
        - Messages
      summary: Recupera i dati di un messaggio
      description: Recupera il contenuto di un messaggio precedentemente creato dato il suo id.
      operationId: getMessageById
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/uidAuthFleet'      # NO EXTERNAL
        - $ref: '#/components/parameters/cxTypeAuthFleet'   # NO EXTERNAL
        - $ref: '#/components/parameters/cxIdAuthFleet'     # NO EXTERNAL
        - $ref: '#/components/parameters/cxGroupsAuthFleet' # NO EXTERNAL
      responses:
        '200':
          description: Message details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Message not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    ###########################################################################################
    ###                          CREAZIONE RICHIESTE DI NOTIFICA                            ###
    ###########################################################################################
  "/delivery/v1/notifications/informal":
    post:
      summary: Richiesta sottomissione di una nuova comunicazione bonaria
      description: |-
        Operazione utilizzata dalla Pubblica Amministrazione per richiedere l'invio di una notifica bonaria.

        La restituzione di uno stato HTTP 202 significa solo che la richiesta è sintatticamente
        valida, non che la richiesta sia stata validata ed accettata. <br/>
        Per conoscere lo stato di accettazione della richiesta di notifica bisogna utilizzare l'operazione
        getInformalNotificationRequestStatusV1 oppure utilizzare la modalità push prevista dai webhook. <br/>

        <details no-external>
        <summary><b> Attributi progettazione di alto livello </b></summary>
        | Proprietà                | Valore             |
        | -----------------------: | :----------------- |
        | __Intended usage__       | B2B, WEB           |
        | __Modalità interazione__ | Sincrona           |
        | __TPS (stimato)__        | 5 richieste/sec    |
        | __Idempotenza__          | No                 |
        | __Read/Write intensive__ | Write              |
        | __Cachable__             | No                 |
        </details>
      tags:
        - NewInformalNotification
      operationId: sendNewInformalNotificationV1
      parameters: # NO EXTERNAL
        - $ref: '#/components/parameters/uidAuthFleet'                # NO EXTERNAL
        - $ref: '#/components/parameters/cxTypeAuthFleet'             # NO EXTERNAL
        - $ref: '#/components/parameters/cxIdAuthFleet'               # NO EXTERNAL
        - $ref: '#/components/parameters/cxGroupsAuthFleet'           # NO EXTERNAL
        - $ref: '#/components/parameters/headerSourceChannel'         # NO EXTERNAL
        - $ref: '#/components/parameters/headerSourceChannelDetails'  # NO EXTERNAL
        - $ref: '#/components/parameters/headerNotificationVersion'   # NO EXTERNAL
      requestBody:
        content:
          application/json:
            schema:
              $ref: "./schemas-pn-notification.yaml#/components/schemas/InformalNotificationRequestV1"
            example:
              senderDenomination: Comune di Palermo
              paProtocolNumber: "302110111988283231"
              campaignId: campaign-1
              subject: Test notifica..302070111988283233
              recipients:
                - recipientType: PF
                  taxId: FRMTTR76M06B715E
                  denomination: Ettore Fieramosca
                  physicalAddress:
                    at: presso
                    address: via Roma
                    addressDetails: Strega
                    zip: "82100"
                    municipality: Benevento
                    province: BN
                    foreignState: ITALIA
                  payments:
                    - pagoPa:
                        noticeCode: "302000111988284400"
                        creditorTaxId: "77777777777"
                        amount: 1250
                        attachment:
                          digests:
                            sha256: 1QKD/Ks6BohyQ+bgMxHf9NrpNhVmGUPxRYE1aerU4JQ=
                          contentType: application/pdf
                          ref:
                            key: PN_NOTIFICATION_ATTACHMENTS-61997b71a19c4e4e97d4228ee74326e9.pdf
                            versionToken: v1
                  messageId: 94484841-57e5-496f-8f2d-eec053c539e3
              documents:
                - digests:
                    sha256: SmHRur4+IVEaMHrYoof4mwzhxh3r2D/+WeVnMQnokgw=
                  contentType: application/pdf
                  ref:
                    key: PN_NOTIFICATION_ATTACHMENTS-dfe837b7e83e43ec9e9135d989196fd8.pdf
                    versionToken: v1
              group: 65e0a77228425a43256303eb
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewInformalNotificationResponse"
              example:
                notificationRequestId: TVBNRS1RR1RHLVZNVEUtMjAyNjA2LUgtQQ==
                paProtocolNumber: "302110111988283231"
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'


    ###########################################################################################
    ###                        VERIFICA STATO RICHIESTE DI NOTIFICA                         ###
    ###########################################################################################
    get:
      operationId: getInformalNotificationRequestStatusV1                       # NO EXTERNAL
#      operationId: retrieveInformalNotificationRequestStatusV1                # ONLY EXTERNAL
      tags:
        - SenderReadInformalNotificationB2B
      summary: Verifica accettazione richiesta notifica
      description: >-
        Questa operazione serve per verificare se la richiesta di notifica è stata accettata e ottenere
        lo IUN associato a tale richiesta. <br/>
        Bisogna specificare il parametro _notificationRequestId_  oppure la coppia costituita dai parametri 
        _paProtocolNumber_ e _idempotenceToken_. <br/>
      parameters:
        - $ref: '#/components/parameters/uidAuthFleet'              # NO EXTERNAL
        - $ref: '#/components/parameters/cxTypeAuthFleet'           # NO EXTERNAL
        - $ref: '#/components/parameters/cxIdAuthFleet'             # NO EXTERNAL
        - $ref: '#/components/parameters/cxGroupsAuthFleet'         # NO EXTERNAL
        - $ref: '#/components/parameters/notificationRequestId'
        - $ref: '#/components/parameters/paProtocolNumber'
        - $ref: '#/components/parameters/idempotenceToken'
      responses:
        '200':
          description: Stato corrente della richiesta di notifica informale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewInformalNotificationRequestStatusResponseV1"
              examples:
                waiting:
                  summary: Richiesta in attesa
                  description: La richiesta è stata presa in carico ma non ancora accettata.
                  value:
                    notificationRequestId: TVBNRS1RR1RHLVZNVEUtMjAyNjA2LUgtQQ==
                    notificationRequestStatus: WAITING
                    retryAfter: 1000
                accepted:
                  summary: Richiesta accettata
                  description: La richiesta è stata accettata e la notifica risulta disponibile.
                  value:
                    notificationRequestId: TVBNRS1RR1RHLVZNVEUtMjAyNjA2LUgtQQ==
                    notificationRequestStatus: ACCEPTED
                    notificationIun: TVBNRS1RR1RHLVZNVEUtMjAyNjA2LUgtQQ==
                    timeline:
                      - status: ACCEPTED
                        timestamp: "2026-06-26T13:33:55.772Z"
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

      ###########################################################################################
      ###                     DOWNLOAD DOCUMENTI E ALLEGATI PER PAGAMENTO                     ###
      ###########################################################################################

  "/delivery/v1/notifications/informal/sent/{iun}/attachments/documents/{docIdx}":
    get:
      description: |-
        Download documento notificato

        <details no-external>
        <summary><b> Attributi progettazione di alto livello </b></summary>
        | Proprietà                | Valore             |
        | -----------------------: | :----------------- |
        | __Intended usage__       | B2B, WEB           |
        | __Modalità interazione__ | Sincrona           |
        | __TPS (stimato)__        |                    |
        | __Idempotenza__          | Si                 |
        | __Read/Write intensive__ | Read               |
        | __Cachable__             | No                 |
        </details>
      summary: Download documento notificato
      tags:
        - SenderReadInformalNotificationB2B
      operationId: getSentInformalNotificationDocument                                      # NO EXTERNAL
#      operationId: retrieveSentInformalNotificationDocument                                # ONLY EXTERNAL
      parameters:
        - $ref: '#/components/parameters/uidAuthFleet'           # NO EXTERNAL
        - $ref: '#/components/parameters/cxTypeAuthFleet'        # NO EXTERNAL
        - $ref: '#/components/parameters/cxIdAuthFleet'          # NO EXTERNAL
        - $ref: '#/components/parameters/cxGroupsAuthFleet'      # NO EXTERNAL
        - $ref: './parameters-notification-search.yaml#/components/parameters/pathInformalIun'
        - $ref: '#/components/parameters/pathDocumentIdx'
