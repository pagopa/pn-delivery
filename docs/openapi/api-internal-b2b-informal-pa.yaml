                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  ###########################################################################################
  ###                          RICERCA NOTIFICHE BONARIE INVIATE                          ###
  ###########################################################################################
  "/delivery/v1/notifications/informal/sent/{iun}":
    get:
      summary: 'Mittente: lettura dettagli notifica versione 1'
      description: |-
        Questa operazione permette di leggere tutti i dettagli di una notifica accettata. <br/>
        
        <details no-external>
        <summary><b> Attributi progettazione di alto livello </b></summary>
        | Proprietà                | Valore             |
        | -----------------------: | :----------------- |
        | __Intended usage__       | B2B, WEB           |
        | __Modalità interazione__ | Sincrona           |
        | __TPS (stimato)__        |                    |
        | __Idempotenza__          | Si                 |
        | __Read/Write intensive__ | Read               |
        | __Cachable__             | No                 |
        </details>
      tags:
        - SenderReadInformalNotificationB2B
      operationId: getSentInformalNotificationV1                                    # NO EXTERNAL
      #      operationId: retrieveSentInformalNotificationV1                                # ONLY EXTERNAL
      parameters:
