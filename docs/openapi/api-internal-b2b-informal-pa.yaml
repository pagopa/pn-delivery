      summary: Interruzione workflow notifica per IUN
      description: >-
        Permette all\'Ente di interrompere il workflow di una comunicazione non 
        legale identificata dallo IUN specificato nel path. La notifica passerà allo stato COMPLETED.
      operationId: terminateInformalWorkflow
      parameters:
